# Copy to config.yaml. SQLite sessions and account tokens need no signing keys.
app:
  name: Blog
  initializationTimeout: 10s
  renderNotifications: true
http:
  listenHost: 127.0.0.1
  port: 8080
  publicOrigin: http://127.0.0.1:8080
  # External login redirect destinations. Add only origins used by enabled providers.
  # When Google is enabled: [https://accounts.google.com]
  formActionOrigins: []
  readTimeout: 10s
  writeTimeout: 40s
  idleTimeout: 2m
  shutdownTimeout: 10s
  session:
    tokenAge: 24h
    cookieAge: 24h
    stores:
      sqliteStore:
        enabled: "true"
        connection: accounts.db?_journal=WAL&_fk=true
        sessionTable: sessions
    types:
      default: sqliteStore
auth:
  enabled: true
  registrationEnabled: true
  registerRequiresVerification: true
  verificationTokenExpiration: 24h
  resetTokenExpiration: 1h
  resetMinimumResponseTime: 2s
  accountStorage:
    provider: sqlite
    options:
      connection: accounts.db?_journal=WAL&_fk=true
  services:
    # Enable email, Google, or both. Login forms follow these settings.
    email:
      enabled: "true"
    google:
      enabled: "false"
      clientID: ""
      clientSecret: ""
      # Register http.publicOrigin + /auth/callback/google in Google Cloud.
# Local Mailpit accepts these credentials when configured with MP_SMTP_AUTH_ACCEPT_ANY.
mail:
  hostname: 127.0.0.1
  port: 1025
  user: blog
  password: local-only
  fromAddress: blog@example.test
  timeout: 10s
