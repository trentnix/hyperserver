name: Firefox startup investigation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    name: ${{ matrix.mode }} / runner ${{ matrix.repeat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false # Preserve comparisons even when one launch fails.
      matrix:
        mode: [baseline, profile, trace]
        repeat: [1, 2]
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      HS_TEST_FIREFOX: firefox
      HS_TEST_BROWSER_STARTUP: ${{ matrix.mode }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Record runner environment
        env:
          HS_TEST_BROWSER_ARTIFACTS: ${{ runner.temp }}/startup-diagnostics
          TMPDIR: ${{ runner.temp }}
        run: |
          echo "HS_TEST_BROWSER_ARTIFACTS=$HS_TEST_BROWSER_ARTIFACTS" >> "$GITHUB_ENV"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          mkdir -p "$HS_TEST_BROWSER_ARTIFACTS"
          {
            uname -a
            cat /etc/os-release
            printenv ImageOS ImageVersion || true
            command -v firefox
            readlink -f "$(command -v firefox)"
            if [[ "$HS_TEST_BROWSER_STARTUP" == trace ]]; then
              command -v strace
              strace --version
            fi
          } | tee "$HS_TEST_BROWSER_ARTIFACTS/environment.txt"

      - name: Observe first and later launches
        run: |
          # No browser warmup. Each launch gets a fresh profile. A late readiness
          # signal remains a failure while evidence collection continues to 90s.
          # Bound each output file to 128 MiB, including external trace output.
          ulimit -f 131072
          go test -v -count=1 -timeout=6m ./cmd/web -run '^TestBrowserStartup$' 2>&1 | tee "$HS_TEST_BROWSER_ARTIFACTS/tests.log"

      - name: Record browser version and profiler support
        if: ${{ !cancelled() }}
        run: |
          # Query Firefox only after the probes so metadata collection does not
          # load its libraries into the file cache before the first launch.
          firefox --version | tee "$HS_TEST_BROWSER_ARTIFACTS/browser-version.txt"
          MOZ_PROFILER_HELP=1 firefox --headless --version > "$HS_TEST_BROWSER_ARTIFACTS/profiler-help.txt" 2>&1
          MOZ_BASE_PROFILER_HELP=1 firefox --headless --version > "$HS_TEST_BROWSER_ARTIFACTS/base-profiler-help.txt" 2>&1

      - name: Upload startup evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-startup-${{ matrix.mode }}-${{ matrix.repeat }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/startup-diagnostics
          retention-days: 7
          if-no-files-found: error
