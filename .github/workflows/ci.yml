name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_diagnostics:
        description: Repeat the standalone Firefox diagnostic test ten times
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-build:
    name: Build local deployment images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build application and maintenance stages
        run: >-
          docker build --file deploy/local/Dockerfile --target maintenance
          --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA"
          --tag hyperserver-rehearsal-ci .

  test:
    name: Tests, vet, and race checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash # Enable pipefail so tee cannot hide a failed test command.
    env:
      CGO_ENABLED: '1' # Required by SQLite and the race detector.
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # Keep CI and local builds on the same Go version.
          cache-dependency-path: go.sum

      - name: Install SQLite migration tool
        env:
          GOBIN: ${{ runner.temp }}/migration-tools
        run: |
          go install -tags sqlite3 github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
          echo "HS_TEST_MIGRATE=$GOBIN/migrate" >> "$GITHUB_ENV"

      - name: Test
        run: go test -count=1 -timeout=5m ./...

      - name: Vet
        run: go vet ./...

      - name: Build and test core without CGO
        env:
          CGO_ENABLED: '0'
        run: |
          go build ./pkg/server
          go test -count=1 -timeout=5m ./pkg/database ./pkg/server

      - name: Test with race detector
        env:
          GORACE: atexit_sleep_ms=0 # Avoid an exit delay for every test subprocess.
        run: go test -race -count=1 -timeout=10m ./...

  performance:
    name: Allocation, memory, and build-size budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOMAXPROCS: '2'
      GOGC: '100'
      GOMEMLIMIT: 'off'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Measure allocations and check budgets
        run: |
          mkdir -p tmp/performance
          {
            go version
            go test -run '^$' -bench 'Benchmark(RenderTemplates|Middleware|Session|Reference)' \
              -benchmem -benchtime=500ms -count=5 \
              ./pkg/components/content ./pkg/services/middleware ./pkg/services/session ./cmd/web
          } | tee tmp/performance/results.txt
          go build -trimpath -ldflags='-s -w' -o tmp/performance/web ./cmd/web
          # Shared runners are not a stable environment for latency budgets.
          go run ./internal/test/perfcheck -results tmp/performance/results.txt -binary tmp/performance/web
          HS_TEST_PERFORMANCE=1 go test -v -count=5 ./cmd/web -run '^TestReferenceHeapBudget$'

  browser:
    name: Firefox browser checks
    # No dependency on the test job: either job must run even if the other fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash # Enable pipefail so tee cannot hide a failed test command.
    env:
      CGO_ENABLED: '1' # Browser application fixtures use SQLite.
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      HS_TEST_FIREFOX: firefox
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Record browser environment
        env:
          HS_TEST_BROWSER_ARTIFACTS: ${{ runner.temp }}/browser-diagnostics
          TMPDIR: ${{ runner.temp }} # Keep profiles visible to browsers that isolate /tmp.
        run: |
          echo "HS_TEST_BROWSER_ARTIFACTS=$HS_TEST_BROWSER_ARTIFACTS" >> "$GITHUB_ENV"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          mkdir -p "$HS_TEST_BROWSER_ARTIFACTS"
          {
            uname -a
            cat /etc/os-release
            printenv ImageOS ImageVersion || true
            command -v firefox
            readlink -f "$(command -v firefox)"
            firefox --version
          } | tee "$HS_TEST_BROWSER_ARTIFACTS/environment.txt"

      - name: Test HTMX and native forms in Firefox
        if: ${{ !inputs.browser_diagnostics }}
        run: |
          # Each browser gets 60s for startup and a separate 15s for checks.
          go test -v -count=1 -timeout=10m ./internal/test/web -run '^TestBrowser(SiteErrors|NativeForms|ResponseDispatch|History|ErrorReporting)$' 2>&1 | tee "$HS_TEST_BROWSER_ARTIFACTS/tests.log"

      - name: Repeat standalone browser diagnostics
        if: ${{ inputs.browser_diagnostics }}
        run: |
          mkdir -p "$HS_TEST_BROWSER_ARTIFACTS"
          # A failed attempt keeps the step failed. This is not a retry policy.
          go test -v -count=10 -timeout=15m ./internal/test/web -run '^TestBrowserErrorReporting$' 2>&1 | tee "$HS_TEST_BROWSER_ARTIFACTS/repeated-tests.log"

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-diagnostics
          if-no-files-found: ignore
          retention-days: 7
