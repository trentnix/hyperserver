name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, vet, and race checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1' # Required by SQLite and the race detector.
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # Keep CI and local builds on the same Go version.
          cache-dependency-path: go.sum

      - name: Test
        run: go test -count=1 -timeout=5m ./...

      - name: Vet
        run: go vet ./...

      - name: Test HTMX in Firefox
        env:
          HS_TEST_FIREFOX: firefox
          TMPDIR: ${{ runner.temp }} # Keep profiles visible to browsers that isolate /tmp.
        run: |
          firefox --version
          # Allow download, 30s startup, 15s checks, and cleanup inside the 75s scenario limit.
          go test -count=1 -timeout=90s ./cmd/web -run '^TestBrowserSiteErrors$'

      - name: Test with race detector
        env:
          GORACE: atexit_sleep_ms=0 # Avoid an exit delay for every test subprocess.
        run: go test -race -count=1 -timeout=5m ./...
