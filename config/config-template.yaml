http:
  hostname: "127.0.0.1"
  port: 8080
  readTimeout: "5s"
  writeTimeout: "10s"
  idleTimeout: "2m"
  tls:
    enabled: false
    certificate: ""
    key: ""
  session:
    key: <your JWT encryption key goes here>
    tokenAge: "24h"
    cookieAge: "24h"
    stores:
      cookieStore:
        enabled: "true"
      sqliteStore:
        enabled: "true"
        connection: "hyperserver.db?_journal=WAL&_timeout=5000&_fk=true"
        sessionTable: "session"
    types:
      default: sqliteStore
      visit: sqliteStore
      user: sqliteStore
      cookie: cookieStore
      sqlite: sqliteStore

auth:
  enabled: "true"
  jwtKey: <your auth token key goes here>
  verificationTokenExpiration: "24h"
  resetTokenExpiration: "1h"
  services:
    email:
      enabled: "false"

mail:
  hostname: "smtp.resend.com"
  port: 587
  user: "resend"
  password: <your resend API key goes here>
  fromAddress: "no-reply@yourdomain.com"

database:
  driver: "sqlite3"
  connection: "hyperserver.db?_journal=WAL&_timeout=5000&_fk=true"
  testConnection: ":memory:?_journal=WAL&_timeout=5000&_fk=true"

app:
  name: "HyperServer"
  workingDirectory: "D:/source/hyperserver"
  renderNotifications: "true"
