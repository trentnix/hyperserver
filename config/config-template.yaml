http:
  hostname: "localhost"
  port: 8080
  readTimeout: "5s"
  writeTimeout: "10s"
  idleTimeout: "2m"
  tls:
    enabled: false
    certificate: ""
    key: ""
  session:
    key: <your JWT encryption key goes here>

database:
  driver: "sqlite3"
  connection: "hyperserver.db?_journal=WAL&_timeout=5000&_fk=true"
  testConnection: ":memory:?_journal=WAL&_timeout=5000&_fk=true"

app:
  title: "HyperServer"
  workingDirectory: "D:/source/hyperserver"