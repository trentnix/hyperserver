<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The framework script handles HTML, plain-text, and connection errors. -->
    <meta name="htmx-config" content='{"includeIndicatorCSS":false}' />
    <link rel="stylesheet" href="/css/site.css" />
    <script src="/js/vendor/htmx/4.0.1/htmx.min.js"
      integrity="sha384-Qp9rdC8H7EqOoX+nR0P3RPG2Noji+qdwJlGpfzwQJsfOpp3sGwIdSP9xO3+UlEhn"
      defer>
    </script>
    <script src="/js/htmx-errors.js" defer></script>
    <script src="/js/site.js" defer></script>
    <title>{{ .Site }} | {{ .Title }}</title>
  </head>

  <body>
    <header>
      {{ template "site.component.nav" . }}
    
    </header>

    <main>
    
      {{ renderPartial .PartialName . }}
    
    </main>
	<footer>HTTP test fixture</footer>

    {{ template "site.component.notifications" . }}

    {{ template "site.component.console_messages" . }}
  </body>
  
</html>
