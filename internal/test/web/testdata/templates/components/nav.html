{{ define "site.component.nav" }}
<nav id="navbar">
  <div class="container">
    <h1><a href="/">{{ .Site }}</a></h1>
    <ul>
      <li><a href="/" class="current">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
      {{ with .LayoutData }}
      {{ if .AuthEnabled }}
      <li>
        {{ if .Authenticated }}
        <form class="logout-form" method="post" action="/auth/logout">
          <button type="submit">Log out</button>
        </form>
        {{ else }}
        <a href="{{ $.ContentManager.AuthURL }}">Log in</a>
        {{ end }}
      </li>
      {{ end }}
      {{ end }}
    </ul>
  </div>
</nav>
{{ end }}
