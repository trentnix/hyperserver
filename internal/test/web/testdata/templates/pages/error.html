{{ define "site.page.error" }}

<section id="showcase" class="section">
  <div class="container">
    <h2>{{ .Title }}</h2>
    {{ if and .Data (gt (len .Data) 0) }}
    <div>
      {{ range .Data }}
        {{ if .IsError }}
        <div class="error-message error">
          {{ .Message }}
        </div>
        {{ end }}
      {{ end }}
    </div>
    {{ else }}
    No errors were specified.
    {{ end }}
</section>

{{ end }}
