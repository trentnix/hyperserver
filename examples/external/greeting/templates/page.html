<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Site}}</title>
</head>
<body><main><h1>{{.Site}}</h1>
<nav><a href="/">Greeting</a> <a href="/notes">Notes</a>
{{if .LayoutData}}<form method="post" action="/auth/logout"><button type="submit">Log out</button></form>
{{else}}<a href="/auth/login/email">Log in</a>{{end}}</nav>
{{range .Notifications}}<p role="status">{{.Message}}</p>{{end}}
{{renderPartial .PartialName .}}</main></body>
</html>
