{{ define "content-messages" }}
    <style>
        .toaster {
            position: fixed;
            bottom: 30px;
            left: 30px;
            min-width: 250px;
            margin-right: 30px;
            padding: 16px;
            border-radius: 4px;
            font-size: 1em;
            z-index: 1000;
            opacity: 0;  /* start invisible */
            animation: fadeinout 4s forwards;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            background-color: #444;
            color: #fff;
        }

        .toaster.success {
            background-color: #4CAF50;
        }

        .toaster.error {
            background-color: #f44336;
        }

        @keyframes fadeinout {
            0% {
                opacity: 0;  /* iInvisible at the start */
            }
            10% {
                opacity: 1;  /* fade in */
            }
            90% {
                opacity: 1;  /* stay visible */
            }
            100% {
                opacity: 0;  /* fade out at the end */
            }
        }
    </style>

    <!-- Only render messages if there are any. -->
    {{ if gt (len .Messages) 0 }}
        {{ range .Messages }}
            <div class="toaster{{ if .IsSuccess }} success{{ else if .IsError }} error{{ end }}">
                {{ .Message }}
            </div>
        {{ end }}
    {{ end }}
{{ end }}
