# Copy to config.yaml in this directory. This address becomes the first Admin.
# Enable multiUser to invite additional users through Users after setup.
# The application config controls whether email verification is required.
adminEmail: admin@example.com
# Enable invitations. When disabled, Users stays visible while multiple users remain.
# Existing users keep access. Restart after changing this setting.
multiUser: false
# Lifetime of invitation links. Resending replaces the previous link.
inviteExpiration: 168h
# Optional public files at /local-assets/{filename}. Create the directory before enabling.
# Paths are relative to the application configuration directory. Keep private files elsewhere.
assetsDirectory: ""
# Number of links in Recent Posts. Must be greater than zero. All posts stays complete.
recentPostCount: 10
# Private image bundles, served through access checks. Keep outside public file roots and back up with the database.
uploadsDirectory: uploads
storage:
  provider: sqlite
  connection: blog.db?_journal=WAL&_fk=true
