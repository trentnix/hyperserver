{{ define "blog.videoEditor" }}
  <section class="video-editor" data-video-editor data-post-component="video" aria-labelledby="video-editor-title">
    <div class="album-editor-heading"><div class="component-heading"><h2 id="video-editor-title">Video</h2>{{ template "blog.componentStatus" }}</div><div class="album-editor-actions">{{ template "blog.componentOrderControls" "Video" }}<button type="button" class="text-button component-remove" data-component-remove="video" hidden>Remove video</button></div></div>
    <p class="form-hint" id="video-help">Add a YouTube or Vimeo URL. Fetch its title and description, or leave the details blank. Save with your post.</p>
    <label for="post-video" data-video-source-label>Video (JSON)</label>
    <textarea id="post-video" name="video" rows="3" aria-describedby="video-help">{{ .Source }}</textarea>
    <fieldset data-video-controls data-component-fields hidden disabled>
      <div class="video-url-field"><label for="video-url">Video URL</label><input id="video-url" data-video-field="url" type="url" maxlength="2048" placeholder="https://www.youtube.com/watch?v=…" aria-describedby="video-help" required></div>
      <button type="button" class="button-primary" data-video-fetch>Fetch details</button>
      <div class="video-details">
        <label for="video-title">Title (optional)</label><input id="video-title" data-video-field="title" maxlength="240">
        <label for="video-caption">Caption (optional)</label><textarea id="video-caption" data-video-field="caption" rows="2" maxlength="1000"></textarea>
      </div>
    </fieldset>
    <div data-video-status role="status"></div>
  </section>
{{ end }}

{{ define "blog.videoIcon" }}<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>{{ end }}
