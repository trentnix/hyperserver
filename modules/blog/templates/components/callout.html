{{ define "blog.calloutEditor" }}
  <section class="markdown-component-editor" data-post-component="callout" aria-labelledby="callout-editor-title">
    <div class="album-editor-heading"><div class="component-heading"><h2 id="callout-editor-title">Callout</h2>{{ template "blog.componentStatus" }}</div>{{ template "blog.componentActions" "callout" }}</div>
    <label for="post-callout">Callout (JSON)</label>
    <textarea id="post-callout" name="callout" rows="3">{{ .Source }}</textarea>
    <fieldset data-component-fields hidden disabled>
      <label for="callout-title">Heading (optional)</label>
      <input id="callout-title" maxlength="240" data-markdown-value="title">
      <label for="callout-body">Text</label>
      <textarea id="callout-body" rows="4" maxlength="20000" required data-markdown-value="body" data-empty-message="Enter callout text." aria-describedby="callout-body-help"></textarea>
      <small id="callout-body-help" class="form-hint">Markdown supported.</small>
      <label for="callout-style">Style</label>
      <div class="callout-style-picker">
        <select id="callout-style" data-markdown-value="style">
          <option value="">Parchment</option>
          <option value="slate">Slate</option>
          <option value="caution">Caution</option>
          <option value="success">Success</option>
        </select>
        <span class="post-callout callout-style-preview" aria-hidden="true"><strong class="post-callout-heading">Aa</strong></span>
      </div>
    </fieldset>
  </section>
{{ end }}

{{ define "blog.calloutIcon" }}<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 9v6m4-5h5m-5 4h4"/></svg>{{ end }}
