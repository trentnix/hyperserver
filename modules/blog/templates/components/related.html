{{ define "blog.relatedEditor" }}
  <section class="related-editor post-picker-editor" data-related-editor data-post-component="related-posts" aria-labelledby="related-editor-title">
    <div class="album-editor-heading"><div class="component-heading"><h2 id="related-editor-title">Related posts</h2>{{ template "blog.componentStatus" }}</div><div class="album-editor-actions">{{ template "blog.componentOrderControls" "Related posts" }}<button type="button" class="text-button component-remove" data-component-remove="related-posts" hidden>Remove related posts</button></div></div>
    <p class="form-hint" id="post-related-help">Choose up to 12 posts. Only published posts appear to readers.</p>
    {{ template "blog.postPicker" . }}
  </section>
{{ end }}

{{ define "blog.relatedIcon" }}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M3 6h1M3 12h1M3 18h1"/></svg>{{ end }}
