{{ define "blog.relatedEditor" }}
  <section class="related-editor post-picker-editor" data-related-editor data-post-component="related-posts" aria-labelledby="related-editor-title">
    <div class="album-editor-heading"><div class="component-heading"><h2 id="related-editor-title">Related content</h2>{{ template "blog.componentStatus" }}</div><div class="album-editor-actions">{{ template "blog.componentActions" "related content" }}</div></div>
    <p class="form-hint" id="post-related-help">Link to up to 12 posts or pages. Readers see public links only.</p>
    {{ template "blog.postPicker" . }}
  </section>
{{ end }}

{{ define "blog.relatedIcon" }}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M3 6h1M3 12h1M3 18h1"/></svg>{{ end }}
