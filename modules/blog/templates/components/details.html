{{ define "blog.detailsEditor" }}
  <section class="markdown-component-editor" data-post-component="expandable-details" aria-labelledby="details-editor-title">
    <div class="album-editor-heading"><div class="component-heading"><h2 id="details-editor-title">Expandable details</h2>{{ template "blog.componentStatus" }}</div>{{ template "blog.componentActions" "expandable details" }}</div>
    <label for="post-details">Expandable details (JSON)</label>
    <textarea id="post-details" name="details" rows="3">{{ .Source }}</textarea>
    <fieldset data-component-fields hidden disabled>
      <label for="details-title">Title</label>
      <input id="details-title" maxlength="240" required data-markdown-value="title">
      <label for="details-body">Details</label>
      <textarea id="details-body" rows="6" maxlength="20000" required data-markdown-value="body" data-empty-message="Enter details." aria-describedby="details-body-help"></textarea>
      <small id="details-body-help" class="form-hint">Markdown supported. Readers can expand this text.</small>
    </fieldset>
  </section>
{{ end }}

{{ define "blog.detailsIcon" }}<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 8 2 2 2-2m3 1h3M7 15h10"/></svg>{{ end }}
