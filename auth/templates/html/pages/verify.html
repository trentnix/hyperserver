{{ define "auth.page.verify" }}
<div id="verify-account" class="verification-panel" aria-labelledby="verification-title">
    <h1 id="verification-title">Verify your email address</h1>
    <p>Confirm to verify the email address associated with this link.</p>
    <form method="post" action="/auth/verify" hx-post="/auth/verify" hx-target="#verify-account" hx-swap="outerHTML">
        <input type="hidden" name="token" value="{{ .Data }}">
        <button type="submit">Verify email address</button>
    </form>
</div>
{{ end }}
