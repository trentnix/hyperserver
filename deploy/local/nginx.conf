pid /tmp/nginx.pid;
# Nginx runtime errors can include full request URLs. The safe access log below
# records failed upstream requests without exposing recovery-token queries.
error_log /dev/null;
events { worker_connections 256; }
http {
    # Never record query strings, cookies, bodies, or authorization headers.
    log_format safe '$request_method $uri $status $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_cache_path /tmp/cache keys_zone=responses:1m max_size=16m inactive=1m;
    map $http_cookie $has_cookie { default 1; "" 0; }
    map $http_authorization $has_authorization { default 1; "" 0; }
    server {
        listen 8443 ssl;
        server_name localhost;
        if ($host != localhost) { return 421; }
        ssl_certificate /tls/cert.pem;
        ssl_certificate_key /tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 10m;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 20s;
            proxy_cache responses;
            proxy_cache_key "$scheme|$http_host|$request_uri|$http_hx_request|$http_hx_history_restore_request";
            proxy_cache_valid 200 30s;
            # Keep upstream Cache-Control, Vary, and Set-Cookie behavior intact.
            proxy_cache_bypass $has_cookie $has_authorization;
            proxy_no_cache $has_cookie $has_authorization;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
